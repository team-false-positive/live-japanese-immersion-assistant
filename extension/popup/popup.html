<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Live Japanese Immersion Assistant</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="popup-container">
    <h1>Live Japanese Immersion Assistant</h1>
    <p id="status">Checking extension status...</p>

    <!-- Placeholder for later weeks: Week 4 Module B plugs the real
         click-to-lookup word/definition card in here. -->
    <div id="word-lookup-placeholder" class="placeholder-card">
      Word lookups will appear here once the dictionary is wired in
      (Week 4).
    </div>

  <div class="search-section">
    <label for="history-search-input">Where have I seen this word?</label>
    <div class="search-row">
      <input type="text" id="history-search-input" placeholder="Type a Japanese word" />
      <button id="history-search-btn">Search</button>
    </div>
    <ul id="history-results"></ul>
  </div>

    <button id="open-options">Settings</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
