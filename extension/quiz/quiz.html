<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Quiz</title>
  <link rel="stylesheet" href="../ui/theme.css" />
  <style>
    .prompt { font-size: 44px; margin: 8px 0; color: var(--ink); }
    #typed-input { font-size: 18px; padding: 6px; width: 240px; }
    #feedback { margin: 12px 0; font-size: 16px; min-height: 22px; }
    #summary { font-size: 18px; margin-top: 16px; }
    .modes { margin-bottom: 14px; }
    #listen { margin: 8px 0; }
  </style>
</head>
<body>
  <h1>Quiz</h1>
  <div class="modes">
    <label for="mode">Mode:</label>
    <select id="mode">
      <option value="choice">Multiple choice (meaning)</option>
      <option value="typed">Typed recall (reading)</option>
    </select>
  </div>
  <p id="progress" class="hint">Loading...</p>
  <div id="streak" class="streak"></div>

  <div id="question" hidden>
    <div id="prompt" class="prompt ja"></div>
    <div id="hint" class="hint ja"></div>
    <button id="listen" class="btn">Listen</button>
    <span id="listen-status" class="hint"></span>
    <div id="choices"></div>
    <div id="typed" hidden>
      <input id="typed-input" class="ja" type="text" placeholder="Type the reading (hiragana, or romaji such as kansenshou)" />
      <button id="submit" class="btn btn-primary">Check</button>
    </div>
    <div id="feedback"></div>
    <button id="next" class="btn btn-primary" hidden>Next</button>
  </div>

  <div id="summary" class="card" hidden></div>
  <p id="empty" hidden>Nothing is due right now. Come back later, or use the review screen.</p>
  <button id="again" class="btn btn-primary" hidden>Start again</button>

  <!-- Shared logic, loaded in order. Each is a plain script with global functions. -->
  <script src="../graph/word-graph.js"></script>
  <script src="../scheduler/scheduler.js"></script>
  <script src="../scheduler/propagation.js"></script>
  <script src="quiz-engine.js"></script>
  <script src="../ui/feedback.js"></script>
  <script src="quiz.js"></script>
</body>
</html>
