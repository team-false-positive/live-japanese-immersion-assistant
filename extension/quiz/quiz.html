<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Quiz</title>
  <style>
    body { font-family: "Segoe UI", sans-serif; margin: 24px; max-width: 640px; }
    h1 { font-size: 20px; }
    #progress { color: #666; }
    .prompt { font-size: 40px; margin: 8px 0; }
    .hint { color: #666; font-size: 18px; margin-bottom: 14px; }
    .choice { display: block; width: 100%; text-align: left; padding: 10px 14px; margin: 6px 0;
              font-size: 16px; border: 1px solid #bbb; border-radius: 6px; background: #fff; cursor: pointer; }
    .choice:hover { background: #f2f4ff; }
    .choice.right { background: #d8f5dc; border-color: #2e7d32; }
    .choice.wrong { background: #fde2e2; border-color: #c62828; }
    #typed-input { font-size: 18px; padding: 6px; width: 240px; }
    button.action { padding: 8px 18px; font-size: 15px; margin-top: 8px; }
    #feedback { margin: 12px 0; font-size: 16px; }
    #summary { font-size: 18px; margin-top: 16px; }
    .modes { margin-bottom: 14px; }
  </style>
</head>
<body>
  <h1>Quiz</h1>
  <div class="modes">
    <label for="mode">Mode:</label>
    <select id="mode">
      <option value="choice">Multiple choice (meaning)</option>
      <option value="typed">Typed recall (reading)</option>
    </select>
  </div>
  <p id="progress">Loading...</p>

  <div id="question" hidden>
    <div id="prompt" class="prompt"></div>
    <div id="hint" class="hint"></div>
    <div id="choices"></div>
    <div id="typed" hidden>
      <input id="typed-input" type="text" placeholder="Type the reading in hiragana" />
      <button id="submit" class="action">Check</button>
    </div>
    <div id="feedback"></div>
    <button id="next" class="action" hidden>Next</button>
  </div>

  <div id="summary" hidden></div>
  <p id="empty" hidden>Nothing is due right now. Come back later, or use the review screen.</p>
  <button id="again" class="action" hidden>Start again</button>

  <!-- Shared logic, loaded in order. Each is a plain script with global functions. -->
  <script src="../graph/word-graph.js"></script>
  <script src="../scheduler/scheduler.js"></script>
  <script src="../scheduler/propagation.js"></script>
  <script src="quiz-engine.js"></script>
  <script src="quiz.js"></script>
</body>
</html>
