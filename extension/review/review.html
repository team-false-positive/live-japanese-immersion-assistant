<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Review</title>
  <link rel="stylesheet" href="../ui/theme.css" />
  <style>
    .word { font-size: 48px; margin: 8px 0 0; color: var(--ink); }
    .reading { color: var(--muted); font-size: 18px; margin-bottom: 16px; }
    #feedback { margin: 12px 0; font-size: 16px; min-height: 22px; }
    #add-status { color: var(--muted); }
    #addbox { margin-top: 32px; border-top: 1px solid var(--line); padding-top: 16px; }
    #add-input { font: inherit; padding: 6px; width: 200px; }
  </style>
</head>
<body>
  <h1>Review</h1>
  <p id="progress" class="hint">Loading...</p>
  <div id="streak" class="streak"></div>

  <div id="session" hidden>
    <div id="word" class="word ja"></div>
    <div id="reading" class="reading ja"></div>
    <div id="choices"></div>
    <div id="feedback"></div>
    <button id="next" class="btn btn-primary" hidden>Next</button>
  </div>

  <p id="empty" hidden>Nothing is due right now. Add words below, or come back later.</p>

  <div id="addbox">
    <label for="add-input">Add a word to review (a dictionary word):</label><br />
    <input id="add-input" type="text" placeholder="e.g. 明白" class="ja" />
    <button id="add-btn" class="btn">Add</button>
    <p id="add-status"></p>
  </div>

  <!-- Shared logic. Each file is a plain script with global functions. -->
  <script src="../graph/word-graph.js"></script>
  <script src="../scheduler/scheduler.js"></script>
  <script src="../scheduler/propagation.js"></script>
  <script src="../ui/feedback.js"></script>
  <script src="review.js"></script>
</body>
</html>
