<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>JLPT progress</title>
  <style>
    body { font-family: "Segoe UI", sans-serif; margin: 24px; max-width: 640px; }
    h1 { font-size: 20px; }
    #status { color: #666; }
    .row { margin: 14px 0; }
    .label { font-size: 16px; margin-bottom: 4px; }

  <h1>JLPT progress</h1>
  <p id="status">Loading...</p>
  <div id="levels"></div>
